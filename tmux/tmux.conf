# ==================== 基础设置 ====================
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 0
setw -g mode-keys vi
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*256col*:Tc"

# ==================== Prefix 改为 Ctrl-a ====================
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# ==================== 分屏 ====================
# `-` 上下分屏；`v`（或 `Shift+-` 即 `_`）左右分屏
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -h -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
unbind '"'
unbind %

# ==================== 窗格导航与调整 ====================
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind '{' swap-pane -U
bind '}' swap-pane -D

# ==================== 重载配置 ====================
bind r run-shell 'tmux source-file "#{?#{E:XDG_CONFIG_HOME},#{E:XDG_CONFIG_HOME},#{E:HOME}/.config}/tmux/tmux.conf"' \; display "Reloaded!"


# ==================== 插件 ====================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-fzf'
set -g @plugin 'fcsonline/tmux-thumbs'

set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'thewtex/tmux-mem-cpu-load'
set -g @plugin 'laktak/extrakto'

# 插件配置
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# ==================== 剪贴板（跨平台 UTF-8） ====================
# tmux-yank 在 WSL 默认走 `cat | clip.exe`，但 zh-CN Windows 的 clip.exe 按
# 系统代码页（GBK/cp936）解读字节，UTF-8 中文会变乱码。win32yank.exe 是
# UTF-8 原生工具（随 Windows 版 Neovim 安装，或 winget install win32yank），
# 检测到就优先用它；否则退回 clip.exe。非 WSL 平台保持 tmux-yank 默认探测。
if-shell 'command -v win32yank.exe >/dev/null 2>&1' \
  'set -g @override_copy_command "win32yank.exe -i --crlf"' \
  'if-shell "command -v clip.exe >/dev/null 2>&1" "set -g @override_copy_command \"clip.exe\""'

# 复制模式里选中文本即同步到系统剪贴板（OSC 52，UTF-8 安全）。
# Windows Terminal / iTerm2 / kitty / WezTerm 等现代终端都支持。
set -g set-clipboard on

# ==================== Catppuccin 配色 ====================
# Expand the same XDG path used by install.sh, falling back to ~/.config.
if-shell '[ -f "#{?#{E:XDG_CONFIG_HOME},#{E:XDG_CONFIG_HOME},#{E:HOME}/.config}/tmux/colors.conf" ]' 'run-shell "tmux source-file #{?#{E:XDG_CONFIG_HOME},#{E:XDG_CONFIG_HOME},#{E:HOME}/.config}/tmux/colors.conf"'

# ==================== 状态栏配置 ====================
# status left look and feel
set -g status-left-length 100
set -g status-left ""
set -ga status-left "#{?client_prefix,#{#[bg=#{@thm_red},fg=default,bold]   #S },#{#[bg=default,fg=#{@thm_red},bold]   #S }}"
set -ga status-left "#[bg=default,fg=#{@thm_overlay0},none,bold]│"
set -ga status-left "#[bg=default,fg=#{@thm_green},bold]   #{=/-20/...:#{window_name}} "
set -ga status-left "#[bg=default,fg=#{@thm_overlay0},none,bold]│"
set -ga status-left "#[bg=default,fg=#{@thm_blue},bold]   #{=/-10/...:#{s|$USER|~|:#{b:pane_current_path}}} "
set -ga status-left "#[bg=default,fg=#{@thm_overlay0},none,bold]#{?window_zoomed_flag,│,}"
set -ga status-left "#[bg=default,fg=#{@thm_yellow},bold]#{?window_zoomed_flag,   zoom ,}"

# status right look and feel
set -g status-right-length 100
set -g status-right ""
set -ga status-right "#[bg=default,fg=#{@thm_blue},bold]  #(#{?#{E:TMUX_PLUGIN_MANAGER_PATH},#{E:TMUX_PLUGIN_MANAGER_PATH},#{E:HOME}/.config/tmux/plugins}/tmux-mem-cpu-load/tmux-mem-cpu-load -i 2 -m 2 | awk \'{print substr($1, 1, 2)}\')%% "
set -ga status-right "#[bg=default,fg=#{@thm_overlay0},none,bold]│"
set -ga status-right "#[bg=default,fg=#{@thm_green},bold] 󰍛 #{cpu_percentage} "
set -ga status-right "#[bg=default,fg=#{@thm_overlay0},none,bold]│"
set -ga status-right "#[bg=default,fg=#{@thm_red},bold] 󱐋#{?#{e|>=:20,#{battery_percentage}},#{#[bg=#{@thm_red},fg=default,bold]},#{#[bg=default,fg=#{@thm_red},bold]}} #{battery_percentage} "
# set -ga status-right "#[bg=default,fg=#{@thm_red},bold] 󱐋#{?#{e|>=:20,#{battery_percentage}},#{#[bg=#{@thm_red},fg=default,bold]},#{#[bg=default,fg=#{@thm_green},bold]}} #{battery_percentage} "
# set -ga status-right "#[bg=default,fg=#{@thm_overlay0},none,bold]│"
# set -ga status-right "#[bg=default,fg=#{@thm_red},bold] 󰭦 %m-%d 󰅐 %H:%M "

# Configure Tmux
set -g status-position bottom
set -g status-style "bg=default"
set -g status-justify "absolute-centre"
# set -g status-interval 1

# pane border look and feel
setw -g pane-border-status off
# setw -g pane-border-status top
setw -g pane-border-format ""
setw -g pane-border-style "bg=default,fg=#{@thm_overlay0}"
setw -g pane-active-border-style "bg=default,fg=#{@thm_red}"
setw -g pane-border-lines single

